# Autoglas Zentrum Aydin · Demo-Auslieferung (Coolify)
# Statisch, kein Build. Demo-Modus: Suchmaschinen bleiben draussen,
# damit der Entwurf nicht neben der echten Seite autoglaszentrum-aydin.de rankt.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  absolute_redirect off;
  server_tokens off;
  access_log off;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Sicherheit
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Standort nur fuer die eigene Seite (Umkreis-Pruefer "Meinen Standort verwenden")
  add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), interest-cohort=()" always;
  # Demo: nicht indexieren. Fuer den Livegang diese Zeile und robots.txt unten entfernen.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  # Gesundheitspruefung fuer Coolify/Docker
  location = /gesund { access_log off; return 204; }

  # Saubere Adressen: /shop statt /shop.html
  location = /shop.html { return 301 /shop; }
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # Dateinamen sind nicht gehasht: Schriften lange, Rest kurz cachen
  location ^~ /assets/fonts/ {
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=3600";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  error_page 404 /index.html;
}
