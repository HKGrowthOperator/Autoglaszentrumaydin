# Autoglas Zentrum Aydin · Demo-Auslieferung (Coolify)
# Statisch, kein Build. Demo-Modus: Suchmaschinen bleiben draussen,
# damit der Entwurf nicht neben der echten Seite autoglaszentrum-aydin.de rankt.

# Zwischenspeicher: HTML, CSS und JS immer kurz nachfragen (ETag, 304),
# damit nach einem Deploy kein Browser eine alte Fassung zeigt.
# CSS/JS tragen zusaetzlich ?v=<Pruefsumme> (setzt das Dockerfile beim Bauen).
map $uri $aza_cache {
  default                   "no-cache";
  ~^/assets/fonts/          "public, max-age=2592000, immutable";
  ~^/assets/img/            "public, max-age=86400";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  absolute_redirect off;
  server_tokens off;
  access_log off;
  etag on;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Kopfzeilen fuer alle Antworten (keine add_header in den locations, sonst gehen diese verloren)
  add_header Cache-Control $aza_cache always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Standort nur fuer die eigene Seite (Umkreis-Pruefer "Meinen Standort verwenden")
  add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), interest-cohort=()" always;
  # Demo: nicht indexieren. Fuer den Livegang diese Zeile und robots.txt unten entfernen.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  # Gesundheitspruefung fuer Coolify/Docker
  location = /gesund { access_log off; return 204; }

  # /shop und /shop.html liefern beide den Shop (Links zeigen auf shop.html,
  # damit auch die Einzeldatei-Vorschau und file:// funktionieren)
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  error_page 404 /index.html;
}
